# fixed project name so local runs and Jenkins runs manage the same stack
name: calculator-stack

services:
  calculator-api:
    build:
      context: .
      dockerfile: Dockerfile
    # Jenkins sets IMAGE_TAG to the build number; a plain `docker compose up` builds/uses :latest
    image: ${DOCKER_IMAGE:-vijay96000/calculator-api}:${IMAGE_TAG:-latest}
    container_name: calculator-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - calculator-net

  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      calculator-api:
        condition: service_healthy
    networks:
      - calculator-net

networks:
  calculator-net:
    name: calculator-net
    driver: bridge
